[workspace]
resolver = "2"
members = [
    "crates/harness-core",
    "crates/harness-config",
    "crates/harness-protocol",
    "crates/harness-http",
    "crates/harness-llm",
    "crates/harness-compress",
    "crates/harness-tools",
    "crates/harness-permissions",
    "crates/harness-store",
    "crates/harness-crash",
    "crates/harness-oxen",
    "crates/harness-local",
    "crates/harness-theme",
    "crates/harness-agent",
    "crates/harness-runtime",
    "crates/harness-host",
    "crates/harness-server",
    "crates/harness-review",
    "crates/harness-preview",
    "crates/harness-media",
    "crates/harness-media-local",
    "crates/harness-study",
    "crates/harness-update",
    "crates/harness-cli",
]
# The Tauri desktop app is a separate project (its own Cargo workspace) so the
# core verification loop stays fast and does not require the webview toolchain.
exclude = ["app"]

[workspace.package]
version = "0.0.9"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/gschoeni/oxen-harness"
authors = ["Greg Schoeninger"]
description = "An open source, hackable agentic coding harness powered by Oxen.ai"

[workspace.dependencies]
harness-core = { path = "crates/harness-core" }
harness-config = { path = "crates/harness-config" }
harness-protocol = { path = "crates/harness-protocol" }
harness-http = { path = "crates/harness-http" }
harness-llm = { path = "crates/harness-llm" }
harness-compress = { path = "crates/harness-compress" }
harness-tools = { path = "crates/harness-tools" }
harness-permissions = { path = "crates/harness-permissions" }
harness-store = { path = "crates/harness-store" }
harness-crash = { path = "crates/harness-crash" }
harness-oxen = { path = "crates/harness-oxen" }
harness-local = { path = "crates/harness-local" }
harness-theme = { path = "crates/harness-theme" }
harness-agent = { path = "crates/harness-agent" }
harness-runtime = { path = "crates/harness-runtime" }
harness-host = { path = "crates/harness-host" }
harness-review = { path = "crates/harness-review" }
harness-preview = { path = "crates/harness-preview" }
harness-media = { path = "crates/harness-media" }
harness-media-local = { path = "crates/harness-media-local" }
harness-study = { path = "crates/harness-study" }
harness-update = { path = "crates/harness-update" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"
toml = "0.8"
dirs = "5"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
base64 = "0.22"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
htmd = "0.5"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

# A shared, deliberately small lint policy every crate inherits via
# `[lints] workspace = true`. The bar: no unsafe outside audited, annotated
# spots, and no debugging leftovers (`dbg!`, `todo!`) in committed code.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"

# Image codecs, hashing, and base64 are pure number-crunching that runs
# 10-50x slower unoptimized, which made a single resize test take seconds and
# dev-build attachments sluggish. Optimizing just these leaf crates keeps our
# own code debuggable and costs only a one-time rebuild of them. (`test`
# inherits from `dev`.)
[profile.dev.package]
sha2 = { opt-level = 3 }
base64 = { opt-level = 3 }
image = { opt-level = 3 }
png = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
image-webp = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
crc32fast = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }
adler2 = { opt-level = 3 }
